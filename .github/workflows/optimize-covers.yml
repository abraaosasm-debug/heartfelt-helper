name: Optimize Covers

on:
  push:
    branches: ["main"]
    paths:
      - "public/covers/*.jpg"
      - ".github/workflows/optimize-covers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-covers
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate lightweight WebP previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source_dir = Path("public/covers")
          output_dir = source_dir / "optimized"
          output_dir.mkdir(parents=True, exist_ok=True)

          files = {
              1: "Imagens_1.jpg",
              2: "Imagens_2.jpg",
              3: "Planejamento_de_4_Semanas_Completo_260921_141949.jpg",
              4: "Rotina_Visual_para_Recortar_Completo_260921_141935.jpg",
              5: "Jogos_de_Mesa_Imprimiveis_03_Completo_260921_142019.jpg",
              6: "Caderno_de_Observacao_da_Aprendizagem_04_Completo_260921_142033.jpg",
              7: "Atividades_para_Enviar_as_Familias_05_Completo_260921_142043.jpg",
          }

          for number, filename in files.items():
              source = source_dir / filename
              target = output_dir / f"cover-{number}.webp"

              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image).convert("RGB")
                  max_width = 720
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)

                  image.save(
                      target,
                      "WEBP",
                      quality=78,
                      method=6,
                      optimize=True,
                  )

              original_size = source.stat().st_size
              optimized_size = target.stat().st_size
              print(
                  f"{filename}: {original_size / 1024:.0f} KB -> "
                  f"{optimized_size / 1024:.0f} KB"
              )
          PY

      - name: Commit optimized previews
        run: |
          if [ -z "$(git status --porcelain -- public/covers/optimized)" ]; then
            echo "No preview changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers/optimized
          git commit -m "perf: gerar previews WebP das capas"
          git pull --rebase origin main
          git push
